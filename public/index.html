<!-- public/index.html -->
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Usuários</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Segoe UI', sans-serif;
        background: #f4f6f9;
        color: #333;
        padding: 2rem;
      }
      h1 {
        text-align: center;
        margin-bottom: 1.5rem;
      }
      form {
        max-width: 480px;
        margin: 0 auto 2rem;
        background: #fff;
        padding: 1.5rem;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      label {
        font-weight: 600;
        font-size: 0.9rem;
      }
      input {
        padding: 0.5rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 1rem;
      }
      button {
        padding: 0.6rem;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      table {
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
        border-collapse: collapse;
        background: #fff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      th,
      td {
        padding: 0.75rem 1rem;
        text-align: left;
        border-bottom: 1px solid #eee;
      }
      th {
        background: #2563eb;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <h1>Cadastro de Usuários</h1>

    <form id="form">
      <label for="cpf">CPF</label>
      <input id="cpf" name="cpf" required placeholder="000.000.000-00" />

      <label for="nome">Nome</label>
      <input id="nome" name="nome" required placeholder="Nome completo" />

      <label for="dataNascimento">Data de Nascimento</label>
      <input id="dataNascimento" name="dataNascimento" type="date" required />

      <button type="submit">Cadastrar</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>CPF</th>
          <th>Nome</th>
          <th>Data Nasc.</th>
          <th>Idade</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <script>
      const form = document.getElementById('form');
      const tbody = document.getElementById('tbody');

      async function carregarUsuarios() {
        const res = await fetch('/usuarios');
        const lista = await res.json();
        tbody.innerHTML = '';
        lista.forEach((u) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${u.cpf}</td><td>${u.nome}</td><td>${u.dataNascimento}</td><td>${u.idade}</td>`;
          tbody.appendChild(tr);
        });
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const dados = {
          cpf: form.cpf.value,
          nome: form.nome.value,
          dataNascimento: form.dataNascimento.value
        };
        await fetch('/usuarios', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        });
        form.reset();
        carregarUsuarios();
      });

      carregarUsuarios();
    </script>
  </body>
</html>
